name: "Publish every Git push to main to FlakeHub"
on:
  push:
    branches:
      - "main"
jobs:
  flakehub-publish:
    runs-on: "ubuntu-latest"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
      - uses: "DeterminateSystems/determinate-nix-action@v3"
      - uses: "DeterminateSystems/flakehub-push@main"
        with:
          name: "totto2727-org/mdt"
          rolling: true
          visibility: "public"
          # Skip FlakeHub pre-publish evaluation because this flake's cache-backed inputs are unavailable to that evaluator.
          my-flake-is-too-big: true
          # Individual output paths are not registered during publication.
          include-output-paths: false
